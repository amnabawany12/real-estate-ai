<!DOCTYPE html>
<html><head><title>Real Estate AI</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-4">
<h1 class="text-3xl font-bold text-center mt-4">🏠 AI Real Estate Platform</h1>
<p class="text-center text-gray-600">Price Prediction + Recommendation + AI Assistant</p>
<div class="flex gap-2 justify-center mt-6">
<button onclick="show('p')" class="bg-blue-600 text-white px-5 py-2 rounded">Price Predict</button>
<button onclick="show('r')" class="bg-green-600 text-white px-5 py-2 rounded">Recommend</button>
<button onclick="show('c')" class="bg-purple-600 text-white px-5 py-2 rounded">AI Chat</button>
</div>
<div id="p" class="bg-white p-6 rounded shadow max-w-xl mx-auto mt-6">
<h2 class="font-bold text-xl">Price Prediction</h2>
<input id="loc" placeholder="Location e.g Clifton" class="border p-2 w-full mt-3 rounded">
<input id="bed" type="number" placeholder="Bedrooms" class="border p-2 w-full mt-2 rounded">
<input id="bath" type="number" placeholder="Bathrooms" class="border p-2 w-full mt-2 rounded">
<input id="area" type="number" placeholder="Area sqft e.g 1500" class="border p-2 w-full mt-2 rounded">
<input id="age" type="number" placeholder="Age years e.g 5" class="border p-2 w-full mt-2 rounded">
<input id="furn" type="number" placeholder="Furnished 0=No 1=Yes" class="border p-2 w-full mt-2 rounded">
<button onclick="predict()" class="bg-blue-600 text-white w-full mt-3 p-3 rounded font-bold">Predict Price</button>
<p id="pr" class="font-bold mt-3 text-lg text-blue-700"></p>
</div>
<div id="r" class="hidden bg-white p-6 rounded shadow max-w-xl mx-auto mt-6">
<h2 class="font-bold text-xl">Recommend Property</h2>
<input id="budget" type="number" placeholder="Budget e.g 20000000" class="border p-2 w-full mt-3 rounded">
<button onclick="recommend()" class="bg-green-600 text-white w-full mt-3 p-3 rounded font-bold">Find Properties</button>
<div id="rr" class="mt-3"></div>
</div>
<div id="c" class="hidden bg-white p-6 rounded shadow max-w-xl mx-auto mt-6">
<h2 class="font-bold text-xl">AI Assistant (RAG + Grok)</h2>
<input id="q" placeholder="e.g What documents needed to buy in DHA?" class="border p-2 w-full mt-3 rounded">
<button onclick="chat()" class="bg-purple-600 text-white w-full mt-3 p-3 rounded font-bold">Ask</button>
<p id="cr" class="mt-3 whitespace-pre-wrap bg-gray-50 p-3 rounded"></p>
</div>
<script>
function show(id){['p','r','c'].forEach(s=>document.getElementById(s).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
async function predict(){let b={Location:loc.value,Bedrooms:+bed.value,Bathrooms:+bath.value,Area_sqft:+area.value,Age_years:+age.value,Furnished:+furn.value};let r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d=await r.json();pr.innerText=d.price;}
async function recommend(){let r=await fetch('/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({budget:+budget.value})});let d=await r.json();rr.innerHTML=d.data.map(x=>`<div class='border p-2 mt-2 rounded'>${x.Location} - ${x.Bedrooms}BHK ${x.Area_sqft}sqft - ${(x.Price_PKR/1e6).toFixed(1)}M PKR</div>`).join('');}
async function chat(){cr.innerText='Thinking...';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});let d=await r.json();cr.innerText=d.answer;}
</script>
</body></html>
